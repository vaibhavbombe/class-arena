# Render Blueprint: New -> Blueprint -> pick this repo.
# Values marked sync: false are asked for in the Render dashboard (never stored in git).
services:
  - type: web
    name: class-arena-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      # Render generates a random secret, so production never shares the local one.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # The Vercel URL, no trailing slash. Used for CORS and invite links.
      - key: CLIENT_URL
        sync: false
