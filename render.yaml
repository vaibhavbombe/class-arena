# Render Blueprint: New -> Blueprint -> pick this repo.
# Values marked sync: false are asked for in the Render dashboard (never stored in git).
services:
  - type: web
    name: class-arena-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      # Render generates a random secret, so production never shares the local one.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Render's free tier blocks SMTP, so production sends email through Brevo's HTTP API.
      - key: BREVO_API_KEY
        sync: false
      # A sender address verified in Brevo.
      - key: MAIL_FROM
        sync: false
      # Live game state. Must be a TLS URL (rediss://), e.g. from Upstash.
      - key: REDIS_URL
        sync: false
      # The Vercel URL, no trailing slash. Used for CORS and invite links.
      - key: CLIENT_URL
        sync: false
      # AI hints, feedback and question drafts. The key is free to create on OpenRouter.
      - key: OPENROUTER_API_KEY
        sync: false
      # A free model (rate-limited; some free providers may log prompts). Bad or missing answers
      # fall back to standard hints/feedback. For a paid model use e.g. anthropic/claude-haiku-5.5
      # and set a credit limit on the key (the hard spending cap).
      # Comma-separated: OpenRouter falls back to the next model when one is rate-limited (429).
      - key: AI_MODEL
        value: google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-26b-a4b-it:free
      # Shared with the Vercel middleware (client/middleware.js); the API only believes the client
      # IP it forwards when this matches. Any long random string, the same in Vercel and Render.
      - key: PROXY_SECRET
        sync: false
      # Encrypts two-factor (authenticator) secrets at rest. 32 random bytes, base64. 2FA stays off
      # until it is set. Changing it later makes existing 2FA setups unreadable (users re-enrol).
      - key: MFA_ENCRYPTION_KEY
        sync: false
