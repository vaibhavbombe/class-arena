<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#46178F" />
    <script>
      // Apply the saved theme before the first paint (no flash). See src/theme.js.
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
    <style>
      html { background: #f2f0f7; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #13101b; } }
      html[data-theme='dark'] { background: #13101b; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <title>ClassArena</title>
  </head>
  <body style="margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
